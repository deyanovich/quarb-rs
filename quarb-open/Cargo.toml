[package]
name = "quarb-open"
version = "0.38.1"
edition = "2024"
description = "One open for every target the Quarb tools speak: files, readings, archives, databases, and the adapter-scheme fleet"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true

[features]
# Kùzu bundles a large C++ build; opt-in, as in qua.
kuzu = ["dep:quarb-kuzu"]
# The databases with heavy builds or client libraries (DuckDB,
# MySQL, SQL Server, Oracle, MongoDB) and the bytes-billed services
# (Athena, BigQuery): the CLI and the session take them, the Python
# package leaves them to the quarb-full package.
heavy = ["dep:quarb-duckdb", "dep:quarb-mysql", "dep:quarb-mssql", "dep:quarb-oracle", "dep:quarb-mongodb", "dep:quarb-athena", "dep:quarb-bigquery"]
default = ["heavy"]

[dependencies]
quarb = { path = "../quarb", version = "0.38.1", features = ["cjk"] }
quarb-fs = { path = "../quarb-fs", version = "0.38.1" }
quarb-imap = { path = "../quarb-imap", version = "0.38.1" }
quarb-json = { path = "../quarb-json", version = "0.38.1" }
quarb-yaml = { path = "../quarb-yaml", version = "0.38.1" }
quarb-toml = { path = "../quarb-toml", version = "0.38.1" }
quarb-kaiv = { path = "../quarb-kaiv", version = "0.38.1" }
quarb-lines = { path = "../quarb-lines", version = "0.38.1" }
quarb-markdown = { path = "../quarb-markdown", version = "0.38.1" }
quarb-gsheet = { path = "../quarb-gsheet", version = "0.38.1" }
quarb-html = { path = "../quarb-html", version = "0.38.1" }
quarb-text = { path = "../quarb-text", version = "0.38.1" }
quarb-text-html = { path = "../quarb-text-html", version = "0.38.1" }
quarb-text-docx = { path = "../quarb-text-docx", version = "0.38.1" }
quarb-text-odt = { path = "../quarb-text-odt", version = "0.38.1" }
quarb-text-rtf = { path = "../quarb-text-rtf", version = "0.38.1" }
quarb-text-doc = { path = "../quarb-text-doc", version = "0.38.1" }
quarb-text-epub = { path = "../quarb-text-epub", version = "0.38.1" }
quarb-text-latex = { path = "../quarb-text-latex", version = "0.38.1" }
quarb-pdf = { path = "../quarb-pdf", version = "0.38.1" }
quarb-text-pdf = { path = "../quarb-text-pdf", version = "0.38.1" }
quarb-text-djvu = { path = "../quarb-text-djvu", version = "0.38.1" }
quarb-text-ofd = { path = "../quarb-text-ofd", version = "0.38.1" }
quarb-text-hwpx = { path = "../quarb-text-hwpx", version = "0.38.1" }
quarb-text-uof = { path = "../quarb-text-uof", version = "0.38.1" }
quarb-text-markdown = { path = "../quarb-text-markdown", version = "0.38.1" }
quarb-xml = { path = "../quarb-xml", version = "0.38.1" }
quarb-bigquery = { path = "../quarb-bigquery", version = "0.38.1", optional = true }
quarb-archive = { path = "../quarb-archive", version = "0.38.1", features = ["rar"] }
quarb-web = { path = "../quarb-web", version = "0.38.1", features = ["sqlite", "postgres"] }
quarb-tree-sitter = { path = "../quarb-tree-sitter", version = "0.38.1" }
quarb-code = { path = "../quarb-code", version = "0.38.1" }
quarb-compose = { path = "../quarb-compose", version = "0.38.1", features = ["koine"] }
quarb-csv = { path = "../quarb-csv", version = "0.38.1" }
quarb-maildir = { path = "../quarb-maildir", version = "0.38.1" }
