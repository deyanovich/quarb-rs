# metatheca's storage layer (apotheca) is unix-only file locking,
# so the mt: door ships on unix and compiles out on Windows — the
# split the CLI and the Python wheel make.
[target.'cfg(unix)'.dependencies]
quarb-metatheca = { path = "../quarb-metatheca", version = "0.38.1" }

[dev-dependencies]
tar.workspace = true
flate2.workspace = true
