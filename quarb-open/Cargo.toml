quarb-cbor = { path = "../quarb-cbor", version = "0.38.1" }
quarb-mount = { path = "../quarb-mount", version = "0.38.1" }
anyhow.workspace = true
quarb-mysql = { path = "../quarb-mysql", version = "0.38.1", optional = true }
quarb-objstore = { path = "../quarb-objstore", version = "0.38.1" }
quarb-neo4j = { path = "../quarb-neo4j", version = "0.38.1" }
