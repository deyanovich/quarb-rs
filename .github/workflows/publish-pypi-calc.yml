name: "Publish quarb-calc to PyPI (dist: quarb-calc)"

# Triggers on `pycalc/v*` tag pushes to this GitHub mirror. Builds
# the `qc` binary (the calculator: qua with every adapter off) as a
# per-platform binary wheel via maturin's `bin` bindings, plus an
# sdist, and publishes atomically to PyPI using OIDC trusted
# publishing.
#
# No Python is embedded (the Python command libraries stay a cargo
# feature), so one wheel serves every Python 3 on its platform:
# the Linux wheels build in maturin's manylinux containers and are
# audited as usual.
#
# The tag pattern is distinct from quarb-py's `py/v*`, quai's
# `quai-py/v*` and quarb-full's `pyfull/v*`, so each tag triggers
# exactly one workflow.
#
# One-time setup required before the first publish:
#
# 1. On PyPI, add a *pending* Trusted Publisher for the new project
#    (https://pypi.org/manage/account/publishing/ — the "pending"
#    section, since `quarb-calc` does not exist on PyPI yet):
#      PyPI Project Name: quarb-calc
#      Owner:             deyanovich
#      Repository:        quarb-rs
#      Workflow name:     publish-pypi-calc.yml
#      Environment:       pypi
#
# 2. The GitHub `pypi` environment already exists (created for the
#    quarb-py workflow); this reuses it.
#
# Windows: qua links SQLite for its saved results, and the runner has
# no sqlite3.lib, so vcpkg builds a static one that libsqlite3-sys
# finds through VCPKG_ROOT. The Windows job may fail without holding
# the release back (the other wheels and the sdist publish; a rerun
# adds the Windows wheel, since existing files are skipped).

on:
  push:
    tags:
      - "pycalc/v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: SQLite for the link (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows-static-md

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --strip
            --manifest-path quarb-calc/Cargo.toml
            --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --manifest-path quarb-calc/Cargo.toml
            --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect dist files
        run: |
          mkdir dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
