name: "Publish quarb-full-py to PyPI (dist: quarb-full)"

# Triggers on `pyfull/v*` tag pushes to this GitHub mirror. Builds the
# complete `qua` CLI (every adapter, DuckDB included — expect the C++
# compile to dominate each job) as a per-platform binary wheel via
# maturin's `bin` bindings, plus an sdist, and publishes atomically to
# PyPI using OIDC trusted publishing.
#
# The tag pattern is distinct from quarb-py's `py/v*` and quai's
# `quai-py/v*`, so each tag triggers exactly one workflow.
#
# One-time setup required before the first publish:
#
# 1. On PyPI, add a *pending* Trusted Publisher for the new project
#    (https://pypi.org/manage/account/publishing/ — the "pending"
#    section, since `quarb-full` does not exist on PyPI yet):
#      PyPI Project Name: quarb-full
#      Owner:             deyanovich
#      Repository:        quarb-rs
#      Workflow name:     publish-pypi-full.yml
#      Environment:       pypi
#
# 2. The GitHub `pypi` environment already exists (created for the
#    quarb-py workflow); this reuses it.

on:
  push:
    tags:
      - "pyfull/v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.platform.target }}, py${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        # Linux on the 22.04 runners (glibc 2.35): the wheel is tagged
        # manylinux_2_35, the oldest glibc the binary runs on, since the
        # host build cannot be audited (it links the host's libpython).
        platform:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # windows-msvc parked: the tree is not Windows-portable
          # yet (apotheca uses unix-only file locking; qua's
          # --edit tempfile path calls libc::dup2). Restore the
          # entry once both are cfg-gated:
          #   - os: windows-latest
          #     target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # The Python command libraries embed CPython (pyo3), so the
      # binary links the libpython it is built against and the wheel
      # is tagged for that version: one build per interpreter. The
      # manylinux images' Pythons ship no shared libpython, so the
      # build runs on the host's setup-python interpreters (built
      # --enable-shared); PyPI refuses the native linux tag, so the
      # Linux wheels carry manylinux_2_35 (the 22.04 runners' glibc)
      # with the audit skipped: it would flag libpython, which the
      # reader's Python provides.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --strip
            --manifest-path qua/Cargo.toml
            --interpreter python${{ matrix.python }}
            --compatibility manylinux_2_35
            --skip-auditwheel
            --out dist
          manylinux: off

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-py${{ matrix.python }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --manifest-path qua/Cargo.toml
            --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect dist files
        run: |
          mkdir dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
