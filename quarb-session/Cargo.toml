[package]
name = "quarb-session"
description = "Backend-agnostic interactive Quarb session — macro history (&N/&N!/&N#) over a pluggable Executor and Store"
keywords = ["query", "repl", "interactive", "quarb"]
categories = ["command-line-utilities"]
readme = "README.md"
# Decoupled from the workspace 0.3.0 fleet (README + quai's patch line).
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# `native` pulls in the full local adapter fleet and the filesystem
# `open`/`mount` dispatch. Without it (the wasm build) only the
# text-format adapters compile, driven by `Doc::parse(text, format)`.
default = ["native", "sqlite"]
# SQLite mounts (path .db and uploaded bytes). Default-on, but
# independent of `native` — rusqlite 0.40 builds for wasm, so the
# browser build wants it too. Opt out (default-features = false)
# when your tree already links another sqlite: libsqlite3-sys has
# `links = "sqlite3"` and cargo permits exactly one such crate,
# so two engines cannot coexist. Note cargo feature UNIFICATION:
# any other dependency pulling quarb-session with defaults turns
# it back on.
sqlite = ["dep:quarb-sqlite"]
native = [
    "dep:quarb-open",
    "dep:quarb-code",
    "dep:quarb-text-koine",
]

[dependencies]
quarb = { path = "../quarb", version = "0.40.0" }
quarb-trace = { path = "../quarb-trace", version = "0.40.0" }
# Text-format adapters — always compiled (wasm-safe).
quarb-json = { path = "../quarb-json", version = "0.40.0" }
quarb-csv = { path = "../quarb-csv", version = "0.40.0" }
quarb-yaml = { path = "../quarb-yaml", version = "0.40.0" }
quarb-toml = { path = "../quarb-toml", version = "0.40.0" }
quarb-xml = { path = "../quarb-xml", version = "0.40.0" }
quarb-html = { path = "../quarb-html", version = "0.40.0" }
quarb-markdown = { path = "../quarb-markdown", version = "0.40.0" }
quarb-text = { path = "../quarb-text", version = "0.40.0" }
quarb-text-html = { path = "../quarb-text-html", version = "0.40.0" }
quarb-text-latex = { path = "../quarb-text-latex", version = "0.40.0" }
quarb-text-rtf = { path = "../quarb-text-rtf", version = "0.40.0" }
quarb-text-doc = { path = "../quarb-text-doc", version = "0.40.0" }
quarb-text-koine = { path = "../quarb-text-koine", version = "0.40.0", optional = true }
quarb-text-markdown = { path = "../quarb-text-markdown", version = "0.40.0" }
quarb-kaiv = { path = "../quarb-kaiv", version = "0.40.0" }
quarb-lines = { path = "../quarb-lines", version = "0.40.0" }
quarb-web = { path = "../quarb-web", version = "0.40.0" }
# Native-only adapters — gated behind `native`.
# Behind `sqlite` (default-on; independent of `native` — rusqlite
# 0.40 builds for wasm via sqlite-wasm-rs, so uploaded .db files
# open in the browser too).
quarb-sqlite = { path = "../quarb-sqlite", version = "0.40.0", optional = true }
quarb-code = { path = "../quarb-code", version = "0.40.0", optional = true }
quarb-mount = { path = "../quarb-mount", version = "0.40.0" }
quarb-open = { path = "../quarb-open", version = "0.40.0", optional = true }
syndesmos = { version = "0.3.1", default-features = false, features = ["uax29"] }
quarb-model = { path = "../quarb-model", version = "0.40.0" }
anyhow.workspace = true

[dev-dependencies]
zip.workspace = true
