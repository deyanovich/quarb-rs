[package]
name = "quarb-text-docx"
description = "Word (.docx) producer for the Quarb text level: the reader's model from declared OOXML structure"
keywords = ["quarb", "docx", "word", "ooxml", "text"]
categories = ["parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.64.0" }
quarb-text = { path = "../quarb-text", version = "0.64.0" }
quick-xml.workspace = true
# deflate alone, the method the format uses: the workspace's zip
# brings codecs backed by C libraries, which wasm32 cannot build
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror.workspace = true

[dev-dependencies]
quarb = { path = "../quarb", version = "0.64.0" }
zip.workspace = true
