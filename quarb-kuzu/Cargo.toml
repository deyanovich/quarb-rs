[package]
name = "quarb-kuzu"
description = "Kùzu embedded graph database adapter for the Quarb query engine"
keywords = ["query", "kuzu", "graph", "quarb", "arbor"]
categories = ["api-bindings", "database"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.23.0" }
kuzu = "0.11"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
time = "0.3"

[build-dependencies]
# Matched to kuzu's `cxx = "=1.0.138"` pin — see build.rs.
cxx-build = "=1.0.138"
