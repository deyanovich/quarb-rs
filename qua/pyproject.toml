[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# The PyPI face of the qua crate itself: `pip install quarb-full`
# ships this crate's binary — the complete CLI, every adapter —
# prebuilt, under its own name. The base `quarb` package installs
# a text-format-subset `qua`; installing quarb-full replaces it
# with the full one (last install wins; `pip install
# --force-reinstall quarb-full` restores it after a quarb
# upgrade).
[project]
name = "quarb-full"
dynamic = ["version"]
requires-python = ">=3.9"
description = "The complete qua CLI, prebuilt — every Quarb adapter (databases, MongoDB, Neo4j, Kubernetes, GitHub, GitLab, mail, object stores, DuckDB, …) and the Python command libraries (numpy, pandas, scipy, scikit-learn, pymorphy3) with no Rust toolchain and no compile"
# The Python command libraries ride in the wheel (the python-libs
# feature below) and the packages they wrap come with it: one pip
# install, then one qua call.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pymorphy3",
    "pymorphy3-dicts-ru",
]
readme = "README-pypi.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Bojan Đuričković" }
]
keywords = ["query", "quarb", "cli", "database", "kubernetes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://quarb.org/"
Adapters = "https://quarb.org/adapters/"
Repository = "https://gitlab.com/quarb/engine"

[tool.maturin]
bindings = "bin"
strip = true
# The Python command libraries embed the interpreter (pyo3), so the
# wheel is built per CPython version and tagged for it; maturin does
# that for a bin crate depending on pyo3.
features = ["python-libs"]
