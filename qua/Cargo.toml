[package]
name = "qua"
description = "Structure-aware query CLI for the Quarb engine"
keywords = ["query", "cli", "quarb", "xpath", "jq"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "qua"
path = "src/main.rs"

[features]
# The adapters and the text model: every source qua can open. Off,
# the build is the calculator profile — the value grammar, the
# value space, the standard library's value commands, the pipes over
# streams of values — which the `quarb-calc` crate ships as `qc`;
# the same source, the same code paths, nothing reimplemented.
default = ["adapters"]
adapters = [
    "dep:quarb-fs",
    "dep:quarb-imap",
    "dep:quarb-json",
    "dep:quarb-yaml",
    "dep:quarb-toml",
    "dep:quarb-kaiv",
    "dep:quarb-lines",
    "dep:quarb-markdown",
    "dep:quarb-gsheet",
    "dep:quarb-html",
    "dep:quarb-text",
    "dep:quarb-text-html",
    "dep:quarb-text-docx",
    "dep:quarb-text-odt",
    "dep:quarb-text-rtf",
    "dep:quarb-text-doc",
    "dep:quarb-text-epub",
    "dep:quarb-text-latex",
    "dep:quarb-pdf",
    "dep:quarb-text-pdf",
    "dep:quarb-text-djvu",
    "dep:quarb-text-ofd",
    "dep:quarb-text-hwpx",
    "dep:quarb-text-uof",
    "dep:quarb-text-markdown",
    "dep:quarb-xml",
    "dep:quarb-bigquery",
    "dep:quarb-archive",
    "dep:quarb-web",
    "dep:quarb-tree-sitter",
    "dep:quarb-code",
    "dep:quarb-compose",
    "dep:quarb-csv",
    "dep:quarb-maildir",
    "dep:quarb-metatheca",
    "dep:quarb-atrep",
    "dep:quarb-text-koine",
    "dep:quarb-datastore",
    "dep:quarb-duckdb",
    "dep:quarb-firebase",
    "dep:quarb-firestore",
    "dep:quarb-git",
    "dep:quarb-github",
    "dep:quarb-gitlab",
    "dep:quarb-xpath",
    "dep:quarb-jq",
    "dep:quarb-azlogs",
    "dep:quarb-cflogs",
    "dep:quarb-cwlogs",
    "dep:quarb-ddlogs",
    "dep:quarb-gcplogs",
    "dep:quarb-kubernetes",
    "dep:quarb-athena",
    "dep:quarb-cosmos",
    "dep:quarb-dynamodb",
    "dep:quarb-kafka",
    "dep:quarb-age",
    "dep:quarb-arangodb",
    "dep:quarb-falkordb",
    "dep:quarb-memgraph",
    "dep:quarb-neptune",
    "dep:quarb-redis",
    "dep:quarb-sparql",
    "dep:quarb-mongodb",
    "dep:quarb-mssql",
    "dep:quarb-oracle",
    "dep:quarb-ldap",
    "dep:quarb-cbor",
    "dep:quarb-mount",
    "dep:quarb-open",
    "dep:syndesmos",
    "dep:quarb-model",
    "dep:quarb-mysql",
    "dep:quarb-objstore",
    "dep:quarb-neo4j",
    "dep:quarb-postgres",
    "dep:quarb-serve",
    "dep:quarb-xlsx",
    "dep:quarb-sql",
    "dep:quarb-sqlite",
    "dep:quarb-relational",
]
# Kùzu bundles a large C++ build; the embedded-graph target is
# opt-in, and the build currently needs two workarounds (both
# upstream kuzu issues):
#   - GCC 15: CXXFLAGS="-include cstdint" (vendored thrift)
#   - kuzu and DuckDB both bundle mbedtls, so linking them into
#     one binary needs RUSTFLAGS="-C link-arg=-Wl,-z,muldefs"
#   RUSTFLAGS="-C link-arg=-Wl,-z,muldefs" \
#     cargo install qua --features kuzu
kuzu = ["adapters", "dep:quarb-kuzu", "quarb-open/kuzu"]
# The pymorphy3 command library (`morph:`): embeds the local Python
# through pyo3, so a default `qua` has no libpython dependency and
# the feature links it in. Needs the pymorphy3 package and its
# Russian dictionaries at run time (pip install pymorphy3
# pymorphy3-dicts-ru); a query naming the library is refused with
# that requirement where they are missing.
morph = ["dep:quarb-lib-morph"]
# The scipy command library (`sp:`): significance tests,
# correlations with p-values, regression and hierarchical clustering
# over the stream as declared commands, the rest of the package by
# reflection; needs scipy at run time (pip install scipy).
scipy = ["dep:quarb-lib-scipy"]
# The scikit-learn command library (`sklearn:`): principal
# components, k-means, tf-idf, topic models, every other estimator
# by reflection; needs scikit-learn at run time (pip install
# scikit-learn).
sklearn = ["dep:quarb-lib-sklearn"]
# numpy (`np:`) and pandas (`pd:`) by reflection: every function and
# method of the package a command, arrays and frames kept as library
# values between commands; need the package at run time.
numpy = ["dep:quarb-lib-numpy"]
pandas = ["dep:quarb-lib-pandas"]
# Every Python-wrapping library at once.
python-libs = ["morph", "scipy", "sklearn", "numpy", "pandas"]
# Count every heap allocation (a counting global allocator) and
# report the total, the bytes requested and the peak heap on
# stderr at exit: the benchmark harness's second build
# (scripts/bench). Never on in a shipped binary.
alloc-stats = []

