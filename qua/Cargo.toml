[package]
name = "qua"
description = "Structure-aware query CLI for the Quarb engine"
keywords = ["query", "cli", "quarb", "xpath", "jq"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "qua"
path = "src/main.rs"

[features]
# Kùzu bundles a large C++ build; the embedded-graph target is
# opt-in, and the build currently needs two workarounds (both
# upstream kuzu issues):
#   - GCC 15: CXXFLAGS="-include cstdint" (vendored thrift)
#   - kuzu and DuckDB both bundle mbedtls, so linking them into
#     one binary needs RUSTFLAGS="-C link-arg=-Wl,-z,muldefs"
#   RUSTFLAGS="-C link-arg=-Wl,-z,muldefs" \
#     cargo install qua --features kuzu
kuzu = ["dep:quarb-kuzu"]

[dependencies]
quarb = { path = "../quarb", version = "0.26.0" }
quarb-fs = { path = "../quarb-fs", version = "0.26.0" }
quarb-imap = { path = "../quarb-imap", version = "0.26.0" }
quarb-json = { path = "../quarb-json", version = "0.26.0" }
quarb-yaml = { path = "../quarb-yaml", version = "0.26.0" }
quarb-toml = { path = "../quarb-toml", version = "0.26.0" }
quarb-kaiv = { path = "../quarb-kaiv", version = "0.26.0" }
quarb-lines = { path = "../quarb-lines", version = "0.26.0" }
quarb-markdown = { path = "../quarb-markdown", version = "0.26.0" }
quarb-gsheet = { path = "../quarb-gsheet", version = "0.26.0" }
quarb-html = { path = "../quarb-html", version = "0.26.0" }
quarb-text = { path = "../quarb-text", version = "0.26.0" }
quarb-text-html = { path = "../quarb-text-html", version = "0.26.0" }
quarb-text-docx = { path = "../quarb-text-docx", version = "0.26.0" }
quarb-text-epub = { path = "../quarb-text-epub", version = "0.26.0" }
quarb-text-latex = { path = "../quarb-text-latex", version = "0.26.0" }
quarb-pdf = { path = "../quarb-pdf", version = "0.26.0" }
quarb-text-pdf = { path = "../quarb-text-pdf", version = "0.26.0" }
