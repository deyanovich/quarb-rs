[package]
name = "quarb-py"
# The PyPI release mirrors the engine release, same number —
# `pip install quarb` 0.9.0 is engine 0.9.0 (the earlier
# decoupled 0.3.x–0.6.x cadence confused version comparisons).
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Python bindings for the Quarb query engine — structure-aware queries over JSON, YAML, TOML, CSV, XML, HTML, and Markdown."
readme = "README.md"
# Not a crates.io publication target — this crate ships to PyPI via
# maturin (see pyproject.toml), not to crates.io.
publish = false

[lib]
name = "_quarb"
crate-type = ["cdylib"]

# metatheca's storage layer (apotheca) is unix-only file
# locking, so the mt: target ships on unix wheels and compiles
# out on Windows — the same split the full CLI makes.
[target.'cfg(unix)'.dependencies]

[dependencies]
quarb = { path = "../quarb", version = "0.45.0" }
quarb-json = { path = "../quarb-json", version = "0.45.0" }
quarb-yaml = { path = "../quarb-yaml", version = "0.45.0" }
quarb-toml = { path = "../quarb-toml", version = "0.45.0" }
quarb-csv = { path = "../quarb-csv", version = "0.45.0" }
quarb-xml = { path = "../quarb-xml", version = "0.45.0" }
quarb-html = { path = "../quarb-html", version = "0.45.0" }
quarb-markdown = { path = "../quarb-markdown", version = "0.45.0" }
quarb-text = { path = "../quarb-text", version = "0.45.0" }
quarb-text-html = { path = "../quarb-text-html", version = "0.45.0" }
quarb-text-markdown = { path = "../quarb-text-markdown", version = "0.45.0" }
quarb-mount = { path = "../quarb-mount", version = "0.45.0" }
quarb-open = { path = "../quarb-open", version = "0.45.0", default-features = false }
# SQLite vendored into the wheel (rusqlite's bundled build): the
# Windows runner has no sqlite3.lib to link, and a wheel carries
# its own engine on every platform.
quarb-sqlite = { path = "../quarb-sqlite", version = "0.45.0", features = ["bundled"] }
quarb-code = { path = "../quarb-code", version = "0.45.0" }
quarb-xpath = { path = "../quarb-xpath", version = "0.45.0" }
quarb-jq = { path = "../quarb-jq", version = "0.45.0" }
quarb-sql = { path = "../quarb-sql", version = "0.45.0" }
quarb-pyvalue = { path = "../quarb-pyvalue", version = "0.45.0" }
pyo3 = { version = "0.28", features = ["abi3-py38"] }

[features]
# The wheel build (maturin) links as an extension module; a
# workspace build leaves the feature off so pyo3 can be unified with
# the embedding libraries (`quarb-lib-morph`), which link libpython.
extension-module = ["pyo3/extension-module"]
