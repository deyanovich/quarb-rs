[package]
name = "quarb-lib-sklearn"
description = "A Quarb command library wrapping scikit-learn through an embedded Python: principal components, k-means, tf-idf and topic models over the stream, as declared commands under the sklearn: prefix"
keywords = ["quarb", "scikit-learn", "pca", "clustering", "tfidf"]
categories = ["science", "mathematics"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.40.1" }
quarb-pyvalue = { path = "../quarb-pyvalue", version = "0.40.1" }
pyo3 = { version = "0.28", features = ["auto-initialize", "abi3-py38"] }
