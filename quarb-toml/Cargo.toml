[package]
name = "quarb-toml"
description = "TOML adapter for the Quarb query engine"
keywords = ["query", "toml", "quarb", "arbor"]
categories = ["parser-implementations", "encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb-json = { path = "../quarb-json", version = "0.62.0" }
# file order for a table's keys, as JSON and YAML keep it: without
# the feature the crate's tables are sorted maps
toml = { version = "1", features = ["preserve_order"] }
serde_json.workspace = true
