[package]
name = "quarb-time"
description = "Quarb's time: instants and durations (ISO 8601, strptime/strftime), periods and grains, time expressions in eleven languages, calendar names"
keywords = ["quarb", "time", "iso8601", "temporal", "timex"]
categories = ["date-and-time", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["calendars"]
# The non-Gregorian calendars (Julian, Hebrew, Hijri, Persian, Coptic,
# Ethiopian, Buddhist, Indian, ROC, Japanese, Chinese, Korean) through
# ICU4X; off, only the Gregorian reading converts.
calendars = ["dep:icu_calendar"]

[dependencies]
regex = "1"
icu_calendar = { version = "2.3", optional = true }
