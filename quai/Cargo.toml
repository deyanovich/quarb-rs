[package]
name = "quai"
description = "Interactive Quarb — a session REPL with query-macro history"
keywords = ["query", "repl", "interactive", "quarb"]
categories = ["command-line-utilities"]
readme = "README.md"
# Decoupled from the workspace 0.3.0 fleet so quai can patch (README,
# the rustyline line-editor) without a full fleet re-release.
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "quai"
path = "src/main.rs"

[dependencies]
ureq.workspace = true
quarb = { path = "../quarb", version = "0.49.0" }
quarb-session = { path = "../quarb-session", version = "0.49.0" }
syndesmos = { version = "0.3.1", default-features = false, features = ["uax29"] }
quarb-model = { path = "../quarb-model", version = "0.49.0" }
quarb-relational = { path = "../quarb-relational", version = "0.49.0" }
# The full mounting dispatch — quai opens every target qua opens.
qua = { path = "../qua", version = "0.49.0" }
clap.workspace = true
anyhow.workspace = true
rustyline = "14"

[features]
# The Python-wrapping command libraries and the `python:` environment
# kind, as qua has them (`cargo install quai --features python`).
python = ["qua/python"]
morph = ["qua/morph"]
scipy = ["qua/scipy"]
sklearn = ["qua/sklearn"]
numpy = ["qua/numpy"]
pandas = ["qua/pandas"]
python-libs = ["qua/python-libs"]
