[package]
name = "quarb-pyvalue"
description = "Quarb values as Python objects and back: the one pyo3 mapping the Python bindings (quarb-py) and the Python-wrapping command libraries share"
keywords = ["quarb", "python", "pyo3"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Start the interpreter on first use: a host that embeds Python
# (qua's `python:` environments) turns it on; an extension module
# (quarb-py) runs inside an interpreter already and must not.
auto-initialize = ["pyo3/auto-initialize"]

[dependencies]
quarb = { path = "../quarb", version = "0.53.0" }
pyo3 = { version = "0.28", features = ["abi3-py38"] }
