[package]
name = "quarb-compose"
description = "Adapter composition: parseable leaf content grafts an inner arbor"
keywords = ["query", "compose", "adapter", "quarb"]
categories = ["data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.31.0" }
quarb-archive = { path = "../quarb-archive", version = "0.31.0" }
quarb-tree-sitter = { path = "../quarb-tree-sitter", version = "0.31.0", optional = true }
quarb-code = { path = "../quarb-code", version = "0.31.0", optional = true }
quarb-csv = { path = "../quarb-csv", version = "0.31.0" }
quarb-html = { path = "../quarb-html", version = "0.31.0" }
quarb-json = { path = "../quarb-json", version = "0.31.0" }
quarb-yaml = { path = "../quarb-yaml", version = "0.31.0" }
quarb-toml = { path = "../quarb-toml", version = "0.31.0" }
quarb-markdown = { path = "../quarb-markdown", version = "0.31.0" }
quarb-text = { path = "../quarb-text", version = "0.31.0" }
quarb-text-html = { path = "../quarb-text-html", version = "0.31.0" }
quarb-text-markdown = { path = "../quarb-text-markdown", version = "0.31.0" }
quarb-xml = { path = "../quarb-xml", version = "0.31.0" }

[features]
# Source files graft through their tree-sitter grammars (the
# syntax level) or the code model. Off for the wasm build, where
# the grammars' C would not compile.
default = ["source"]
source = ["dep:quarb-tree-sitter", "dep:quarb-code"]

[dev-dependencies]
quarb-fs = { path = "../quarb-fs" }
tar.workspace = true
flate2.workspace = true
