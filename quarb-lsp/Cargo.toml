[package]
name = "quarb-lsp"
version = "0.28.0"
edition = "2024"
description = "Language server for Quarb — diagnostics and completion over LSP JSON-RPC and kaivrpc"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/quarb/engine"

[dependencies]
quarb = { path = "../quarb", version = "0.28.0" }
kaivrpc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "quarb-lsp"
path = "src/main.rs"
