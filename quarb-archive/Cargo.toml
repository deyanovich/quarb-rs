[package]
name = "quarb-archive"
description = "Zip and tar archive adapter for the Quarb query engine"
keywords = ["query", "zip", "tar", "archive", "quarb"]
categories = ["parser-implementations", "filesystem"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.33.0" }
# Every format a reliable pure-Rust library covers, so the crate
# builds for wasm32: zip members deflate / deflate64 / bzip2 (the
# bzip2 crate's default backend is libbz2-rs-sys, pure Rust) /
# lzma (lzma-rs); tar plain / gzip (flate2) / xz (lzma-rs) /
# bzip2 / zstd (ruzstd). Zip members in zstd and xz, and rar,
# would need a C library and are left out. 7z (sevenz-rust
# without its C-backed extras) reads on native targets only: the
# library's own wasm32 module does not compile without its
# encoder, so the browser build refuses a 7z archive.
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
tar.workspace = true
flate2.workspace = true
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }
lzma-rs = "0.3"
ruzstd = "0.9"
thiserror.workspace = true
unrar = { version = "0.5.8", optional = true }
libchm = "0.3.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sevenz-rust = { version = "0.6", default-features = false }

[dev-dependencies]
zip.workspace = true
tempfile.workspace = true
# Test-only and path-only: quarb-compose depends on this crate, so a
# version requirement here would be a cycle crates.io cannot resolve
# (a dev-dependency without a version is dropped on publish).
quarb-compose = { path = "../quarb-compose" }
sevenz-rust = { version = "0.6", features = ["compress"] }

[features]
rar = ["dep:unrar"]
