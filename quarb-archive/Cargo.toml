[package]
name = "quarb-archive"
description = "Zip and tar archive adapter for the Quarb query engine"
keywords = ["query", "zip", "tar", "archive", "quarb"]
categories = ["parser-implementations", "filesystem"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.31.0" }
# deflate only: the pure-Rust subset, so the crate builds for
# wasm32 (bzip2/zstd would pull in C).
zip = { version = "2", default-features = false, features = ["deflate"] }
tar.workspace = true
flate2.workspace = true
thiserror.workspace = true

[dev-dependencies]
zip.workspace = true
