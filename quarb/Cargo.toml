[package]
name = "quarb"
description = "Query engine for arbors (arboreal graphs - tree-spanned or tree-dominated graphs)"
keywords = ["query", "arbor", "graph", "xpath", "jq"]
categories = ["parser-implementations", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["colligo", "decode-formats", "kaiv", "desm"]
# `decode(yaml|toml|xml|json)`: the structured readings of a text,
# each a parser dependency of its own. Off, `decode` keeps the
# byte schemes (base64, hex, …) and the structured names refuse.
decode-formats = ["dep:serde_json", "dep:serde_yaml_ng", "dep:toml", "dep:quick-xml"]
# `| kaiv` / `@| kaiv`: values rendered as a kaiv document.
kaiv = ["dep:kaiv"]
# The sentence bonds of a `.desm` file (syndesmos) as the session's
# `SentenceBonds`; off, `sentences` segments by UAX #29 alone and a
# tool supplies bonds through the trait if it has any.
desm = ["dep:syndesmos"]
# Locale-aware collation for `sort(LOCALE)`, via the colligo
# collator (which replaced ICU4X in 0.1.2 — ~7x less dependency
# weight, specialized to the context-free majority of locales).
# With the feature disabled, `sort(LOCALE)` still parses but
# orders by the standard value comparison (codepoint for text) —
# useful for minimal builds (e.g. wasm) that can spare the
# ~1 MB of embedded collation data.
colligo = ["dep:colligo"]
# The CJK encodings at the source boundary (`?encoding=gbk`,
# shift_jis, euc-kr, big5): their tables are the bulk of
# encoding_rs, so the playground and the extension leave them
# out; `qua` turns them on. Every other Encoding Standard label
# is always known.
cjk = []

# The signal mask of the thread that feeds a child's stdin: a
# callee that stops reading (head, a failed program) must give the
# writer EPIPE, not SIGPIPE, under a host that restored the default
# disposition for its own stdout (qua does).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
quarb-trace = { path = "../quarb-trace", version = "0.38.1" }
quarb-time = { path = "../quarb-time", version = "0.38.1" }
kaiv = { version = "0.15.0", default-features = false, optional = true }
thiserror.workspace = true
globset.workspace = true
regex = "1"
url = "2"
unicode-segmentation = "1"
strsim = "0.11"
rust-stemmers = "1"
unicode-normalization = "0.1"
syndesmos = { path = "../../../lit/syndesmos", version = "0.3.1", default-features = false, features = ["uax29"], optional = true }
colligo = { version = "0.1.1", default-features = false, features = ["embedded-data"], optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml_ng = { version = "0.10.0", optional = true }
toml = { version = "1.1.2", optional = true }
quick-xml = { workspace = true, optional = true }
encoding_rs = "0.8"
