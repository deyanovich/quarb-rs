[package]
name = "quarb"
description = "Query engine for arbors (arboreal graphs - tree-spanned or tree-dominated graphs)"
keywords = ["query", "arbor", "graph", "xpath", "jq"]
categories = ["parser-implementations", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["colligo"]
# Locale-aware collation for `sort(LOCALE)`, via the colligo
# collator (which replaced ICU4X in 0.1.2 — ~7x less dependency
# weight, specialized to the context-free majority of locales).
# With the feature disabled, `sort(LOCALE)` still parses but
# orders by the standard value comparison (codepoint for text) —
# useful for minimal builds (e.g. wasm) that can spare the
# ~1 MB of embedded collation data.
colligo = ["dep:colligo"]
# The CJK encodings at the source boundary (`?encoding=gbk`,
# shift_jis, euc-kr, big5): their tables are the bulk of
# encoding_rs, so the playground and the extension leave them
# out; `qua` turns them on. Every other Encoding Standard label
# is always known.
cjk = []

[dependencies]
quarb-trace = { path = "../quarb-trace", version = "0.33.0" }
kaiv = { version = "0.15.0", default-features = false }
thiserror.workspace = true
globset.workspace = true
regex = "1"
url = "2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
syndesmos = { version = "0.3.1", default-features = false, features = ["uax29"] }
colligo = { version = "0.1.1", default-features = false, features = ["embedded-data"], optional = true }
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
toml = "1.1.2"
quick-xml.workspace = true
encoding_rs = "0.8"
