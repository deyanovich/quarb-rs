[package]
name = "quarb-lib-scipy"
description = "A Quarb command library wrapping scipy through an embedded Python: significance tests, correlations with p-values, regression and hierarchical clustering over the stream, as declared commands under the sp: prefix, and the rest of the package by reflection"
keywords = ["quarb", "scipy", "statistics", "clustering", "command-library"]
categories = ["science", "mathematics"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
quarb = { path = "../quarb", version = "0.40.1" }
quarb-pyvalue = { path = "../quarb-pyvalue", version = "0.40.1" }
pyo3 = { version = "0.28", features = ["auto-initialize", "abi3-py38"] }
