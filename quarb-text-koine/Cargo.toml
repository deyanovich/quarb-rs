[package]
name = "quarb-text-koine"
description = "Koine/litogramma producer for the Quarb text level — the reader's model from an atrep document"
# 0.39.1 is a lone point release beside quarb-xlsx 0.39.1: calamine
# 0.27 turns on quick-xml's `encoding` feature, under which the
# published 0.39.0 does not compile. The next train restores
# `version.workspace = true`.
version = "0.39.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quarb-text = { path = "../quarb-text", version = "0.39.0" }
atrep = { version = "0.3.10", default-features = false, features = ["docx"] }
flate2.workspace = true
thiserror = "2"
quick-xml = "0.37"

[dev-dependencies]
quarb-text-docx = { path = "../quarb-text-docx", version = "0.39.0" }
flate2.workspace = true
regex = "1"
quarb = { path = "../quarb", version = "0.39.0" }
