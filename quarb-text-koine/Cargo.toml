[package]
name = "quarb-text-koine"
description = "Koine/litogramma producer for the Quarb text level — the reader's model from an atrep document"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quarb-text = { path = "../quarb-text", version = "0.36.0" }
atrep = { version = "0.3.9", default-features = false, features = ["docx"] }
flate2.workspace = true
thiserror = "2"
quick-xml = "0.37"

[dev-dependencies]
quarb-text-docx = { path = "../quarb-text-docx", version = "0.36.0" }
flate2.workspace = true
regex = "1"
quarb = { path = "../quarb", version = "0.36.0" }
