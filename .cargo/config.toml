# wasm32 builds (quarb-wasm, the playground): getrandom 0.3 needs
# its backend named explicitly on wasm32-unknown-unknown; wasm_js
# routes it to crypto.getRandomValues via wasm-bindgen. Pairs with
# the `getrandom = { features = ["wasm_js"] }` dep in quarb-wasm.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# kuzu 0.11.3's vendored thrift misses <cstdint> includes, which
# GCC 15 rejects; force the include until upstream catches up.
# crates.io consumers opt into kuzu via qua's `kuzu` feature and
# need the same flag on affected toolchains (documented there).
[env]
CXXFLAGS = "-include cstdint"
