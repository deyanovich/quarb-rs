[package]
name = "quai-wasm"
description = "Browser build of interactive Quarb (quai) — the demo.quarb.org/quai session playground"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `native` feature (no daemon, no filesystem opener): the sources
# come from the page as text or bytes and are read by Doc::read. The
# composing layer (graft on demand, a declared notation at a hop,
# a database's JSON columns) and the koine reader (an atrep
# document, TEI and the other vocabularies at the text level) are
# asked for by name; both are pure Rust.
quarb-session = { path = "../quarb-session", default-features = false, features = ["sqlite", "compose", "koine", "xlsx", "archives", "docx", "odt"] }
quarb-model = { path = "../quarb-model", version = "0.63.0" }
quarb = { path = "../quarb" }
# The web level over pages held in memory (a site loaded from its
# sitemap by the browser extension). The session's reader also opens
# a site's tarball (`web:…/site.tgz` in a notebook's mount line)
# through quarb-web's archive store, which quarb-session links.
quarb-web = { path = "../quarb-web", default-features = false }
quarb-mount = { path = "../quarb-mount" }
wasm-bindgen = "0.2"
serde_json.workspace = true
# The session's errors are anyhow's; the envelope downcasts a Quarb
# error out of one for its code and site.
anyhow.workspace = true
# scraper (via quarb-html, pulled in by quarb-session) → ahash →
# getrandom: the JS backend must be opted in on wasm32-unknown-unknown.
getrandom = { version = "0.3", features = ["wasm_js"] }
